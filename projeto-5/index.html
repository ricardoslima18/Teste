<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contato</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-envelope"></i>Contato</h1>
        </header>
    <form id="contact-form" class="form">
        <div class="form-control">
            <label for="name"><i class="fas fa-user"></i>Nome Completo</label>
            <input type="text" id="name" name="name" placeholder="Digite seu nome completo" required>
        </div>
    </form>
        <form id="contact-form" class="form">
        <div class="form-control">
            <label for="email"><i class="fas fa-envelope"></i>Email</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>
        </div>
    </form>
        <form id="contact-form" class="form">
        <div class="form-control">
            <label for="subject"><i class="fas fa-edit"></i>Assunto</label>
            <input type="text" id="subject" name="subject" placeholder="Diga o assunto." required>
        </div>
    </form>
        <form id="contact-form" class="form">
        <div class="form-control">
            <label for="message"><i class="fas fa-comment"></i>Digite sua mensagem.</label>
            <textarea id="message" name="message" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
        </div>
        <button type="submit" class="formulario-btn"><i class="fas fa-paper-plane"></i>Enviar</button>
    </form>
            <div class id="successMessage" class="successMessage">
            <i class="fas fa-check-circle"></i>
            <small>Mensagem enviada com sucesso! Ty </small>
        </div>
    </div>

</body>
</html>
